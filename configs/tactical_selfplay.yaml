# SELF-PLAY battles over several corners (after run 2 of tactical_real swapped places
# back and forth instead of racing). Changes from tactical_real.yaml:
# - rival_frac 0.5: half the episodes race a car driven by a frozen copy of the
#   policy (a pool of the last 10, one added every 250k decisions); the rest race
#   the scripted cars. GT Sophy trained against such a mixed population (Wurman et
#   al., Nature 2022): scripted-only made it too aggressive, aggressive-only timid.
# - passes must stick: pass_hold_m 1000 (about 3 corners) before the bonus is paid;
#   a pass that is undone pays nothing.
# - GT Sophy's passing reward: pass_reward_per_m 1.0 for each metre gained on (lost
#   to) the other car while it is within 20 m behind / 40 m ahead.
# - battles last 150 s (episode_s) instead of 60 s, and a car slowed to 3 m/s
#   (min_speed_ms, was 10) behind another in a hairpin no longer ends the episode.
# - warm start from run 2 (init_model), no behaviour cloning.
# - intervention_penalty 3.0 per command the no-crash filter has to change: in run 2
#   the moves drove into the other car and the filter braked both to a crawl.
# Reward before/after (vs tactical_real): pass_hold_m 0 -> 1000, pass_reward_per_m
# 0 -> 1.0, intervention_penalty 0 -> 3, episode_s 60 -> 150, min_speed_ms 10 -> 3.
# Invalidates earlier runs.
tactical: true

run:
  name: tactical_selfplay
  seed: 0
  total_timesteps: 5000000   # decisions of 0.5 s, summed over all envs
  n_envs: 8
  eval_every_steps: 250000
  torch_threads: 3
  bc_decisions: 0
  real_start_frac: 0.6
  incident_dir: data/incidents
  real_eval_per_track: 30
  rival_frac: 0.5
  pool_every_steps: 250000
  pool_size: 10
  init_model: runs/tactical_real/model_best.zip

sim:
  dt_s: 0.02
  max_episode_steps: 10000

env:
  action_repeat: 5
  reference_features: true
  tactical: true
  tires: true
  safety_filter: true
  wear_cost_per_unit: 3000.0
  opponents: [none, backmarker, slow, equal, defender, attacker]
  overtake_bonus: 100.0
  pass_hold_m: 1000.0
  pass_reward_per_m: 1.0
  intervention_penalty: 3.0
  lookahead_windows_m: [10, 20, 30, 40, 50, 60, 80, 100, 125, 150, 200, 250]
  progress_scale_m: 10.0
  fail_penalty: 50.0
  episode_s: 150.0
  min_speed_ms: 3.0

ppo:
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 512
  n_epochs: 6
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.02
  clip_range: 0.2

policy:
  net_arch: [256, 256]
  activation_fn: ReLU
