# FULL driver (stage B): residual SAC on the scripted optimal-line follower, now with
# tyre wear, a push<->conserve mode and other cars (overtake, defend). Per episode the
# env draws a push level, a tyre wear and (usually) an opponent: a slower car to pass, an
# equal one, a defender that covers the pass, or a quicker attacker behind.
# Tyre and wake constants are design choices (config.TireParams), not F1 figures.
# Scenario laps on the validation tracks count in the checkpoint score.

run:
  name: racer_full
  seed: 0
  total_timesteps: 3000000
  n_envs: 8
  eval_every_steps: 100000
  eval_seed: 10000
  eval_train_tracks: 4
  torch_threads: 3
  replay_every_decisions: 5
  eval_scenarios:
    - {name: push,        options: {push: 1.0}, min_passes: 0}
    - {name: conserve,    options: {push: 0.0}, min_passes: 0}
    - {name: pass_slow,   options: {opponent: slow,     gap_m: 40}, min_passes: 1}
    - {name: pass_equal,  options: {opponent: equal,    gap_m: 40}, min_passes: 1}
    - {name: pass_defender, options: {opponent: defender, gap_m: 40}, min_passes: 1}
    - {name: defend,      options: {opponent: attacker, gap_m: 30, wear: 0.4}, min_passes: 0}

sim:
  dt_s: 0.02
  max_episode_steps: 10000

env:
  action_repeat: 5
  reference_features: true
  residual_scale: 0.3
  tires: true
  wear_cost_per_unit: 3000.0
  opponents: [none, slow, equal, defender, attacker]
  overtake_bonus: 20.0
  lookahead_windows_m: [10, 20, 30, 40, 50, 60, 80, 100, 125, 150, 200, 250]
  smooth_penalty: 0.1
  progress_scale_m: 10.0
  fail_penalty: 50.0
  episode_s: 60.0

sac:
  learning_rate: {start: 0.0003, end: 0.00003}
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 256
  tau: 0.005
  gamma: 0.995
  train_freq: 1
  gradient_steps: 4
  ent_coef: auto_0.1

policy:
  net_arch: [256, 256]
  activation_fn: ReLU
