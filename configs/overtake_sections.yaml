# Overtaking, one track section at a time (2026-10-29). Phase 1 of 2.
#
# Every straight, braking zone and corner of the 17 training tracks is its own short
# battle (`f1rl.sections`): start 6-20 m behind a slower car at the section's start;
# won only if ahead by the section's end and the pass then sticks (pass_hold_m).
# Sections won only some of the time are drawn most often (section_priority). Opponents: a
# slow car, lapped traffic, and the defending sparring driver at the slow pace
# (guard_slow, `f1rl.agents.guard`). Phase 2 (overtake_combined.yaml) starts from
# this model and mixes sections with whole battles.
#
# Same world as tactical_v4.yaml (fixed shield, tow, wake, track limits) and the
# same no-crash filter on both cars. Reward = tactical_v4's plus, in section
# battles only: +30 when ahead at the section's end, -30 when still behind (then
# the battle ends). Earlier runs are unaffected (no section battles there).
# Checked first with scripts/section_gate.py (the scripted tactician) and
# scripts/section_oracle.py (brute force over single moves and timings).
#
# World changes against tactical_v4 (found with the oracle: in the v4 world even
# brute force won only 25 of 180 sections on 6 tracks, the attacker almost never got
# alongside):
# - slow_power_frac 0.97: cars slower through the corners are also ~3% down on top
#   speed and acceleration (before: equal on the straights, so out of the tow a
#   slower car could never be caught on a straight).
# - pull_moves: two extra moves, pull_in / pull_out, that pull alongside right away,
#   also in a braking zone or a corner (an attacker may; a defender still may not
#   move under braking). The planned moves need 100 m before the braking point.
# - corner battles start half alongside (corner_gap_m 3 behind, corner_shift_m 3 to
#   the inside or outside): from straight behind, one corner is too short to pass.
tactical: true

run:
  name: overtake_sections
  seed: 0
  total_timesteps: 1000000   # agent decisions (a committed move is one decision)
  n_envs: 12
  eval_every_steps: 100000
  torch_threads: 2
  bc_decisions: 60000
  bc_epochs: 10
  real_start_frac: 0.0
  incident_dir: data/incidents
  real_eval_per_track: 20
  section_frac: 1.0
  section_opponents: [slow, slow, guard_slow, guard_slow, backmarker]
  section_gap_m: [6.5, 16.0]
  section_priority: true
  section_eval_opponents: [slow, guard_slow]
  section_eval_gap_m: 9.0
  rival_frac: 0.0   # self-play needs in-process envs; this run uses 12 processes
  pool_every_steps: 150000
  pool_size: 8
  normalize_reward: true
  subproc: true

sim:
  dt_s: 0.02
  max_episode_steps: 10000

env:
  action_repeat: 5
  reference_features: true
  tactical: true
  tires: true
  safety_filter: true
  wear_cost_per_unit: 3000.0
  opponents: [none, slow, slow, equal, defender, attacker, attacker_equal, backmarker]
  opponent_gap_m: [10.0, 35.0]
  real_gap_m: [8.0, 40.0]
  overtake_bonus: 100.0
  pass_hold_m: 600.0
  pass_reward_per_m: 1.0
  intervention_penalty: 0.5
  lookahead_windows_m: [10, 20, 30, 40, 50, 60, 80, 100, 125, 150, 200, 250]
  progress_scale_m: 50.0
  fail_penalty: 50.0
  episode_s: 90.0
  min_speed_ms: 3.0
  follow_shield: true
  shield_in_tow: false
  soft_follow: true
  opponent_yield: false
  wake_anticipation_m: 25.0
  tow_accel_gain: 0.3
  path_edge_inset_m: 0.6
  track_limit_margin_m: 0.5
  commit_moves: true
  slow_power_frac: 0.97
  pull_moves: true
  section_win_bonus: 30.0
  section_fail_penalty: 30.0
  section_tail_m: 100.0
  rescue_penalty: 0.0
  dirty_penalty: 1.0
  hold_until_clear: true
  opponent_features: true
  guard:
    react_gap_m: 60.0
    inside_gap_s: 0.35
    inside_from_m: 300.0
    threat_margin_m: 4.0
    cover_lateral_m: 1.0
    reaction_s: 0.15
    max_shift_m: 3.0
    room_m: 3.0

ppo:
  learning_rate: 0.0003
  n_steps: 128
  batch_size: 256
  n_epochs: 8
  gamma: 0.97      # a decision is 0.5 s or a whole move: shorter look-ahead than 0.99
  gae_lambda: 0.95
  ent_coef: 0.02
  clip_range: 0.2

policy:
  net_arch: [256, 256]
  activation_fn: ReLU

sections:
  approach_m: 200.0
  past_apex_m: 30.0
  turn_in_frac: 0.5
  corner_exit_m: 300.0
  straight_from_apex_m: 10.0
  corner_gap_m: 3.0
  corner_shift_m: 3.0
  min_length_m: 80.0
  finish_at_exit: true
