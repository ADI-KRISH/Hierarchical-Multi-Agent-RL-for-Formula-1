# Overtaking, phase 2 of 2 (2026-10-29): put the sections together.
#
# Starts from phase 1's best model (overtake_sections.yaml, one section per battle)
# and mixes: 40% section battles (as phase 1, so no section is forgotten), 30%
# starts from real 2018-2025 passes, 30% whole 90 s battles against slower cars and
# the defending sparring driver at all three paces, where the driver must pick its
# moment over several corners. Same world, reward and no-crash filter as phase 1.
# Attacking only: defending is trained later.
tactical: true

run:
  name: overtake_combined
  seed: 0
  total_timesteps: 500000   # agent decisions (a committed move is one decision)
  n_envs: 12
  eval_every_steps: 100000
  torch_threads: 2
  bc_decisions: 0
  init_model: runs/overtake_sections/model_best.zip
  bc_epochs: 10
  real_start_frac: 0.5   # of the episodes that are not section battles
  real_roles: [attack]   # attacking only for now
  incident_dir: data/incidents
  real_eval_per_track: 20
  section_frac: 0.4
  section_opponents: [slow, slow, guard_slow, guard_slow, backmarker]
  section_gap_m: [6.5, 16.0]
  section_priority: true
  section_eval_opponents: [slow, guard_slow]
  section_eval_gap_m: 9.0
  rival_frac: 0.0   # self-play needs in-process envs; this run uses 12 processes
  pool_every_steps: 150000
  pool_size: 8
  normalize_reward: true
  subproc: true

sim:
  dt_s: 0.02
  max_episode_steps: 10000

env:
  action_repeat: 5
  reference_features: true
  tactical: true
  tires: true
  safety_filter: true
  wear_cost_per_unit: 3000.0
  opponents: [slow, guard_slow, guard_slow, guard_mid, guard_equal, equal, backmarker]
  opponent_gap_m: [10.0, 35.0]
  real_gap_m: [8.0, 40.0]
  overtake_bonus: 100.0
  pass_hold_m: 600.0
  pass_reward_per_m: 1.0
  intervention_penalty: 0.5
  lookahead_windows_m: [10, 20, 30, 40, 50, 60, 80, 100, 125, 150, 200, 250]
  progress_scale_m: 50.0
  fail_penalty: 50.0
  episode_s: 90.0
  min_speed_ms: 3.0
  follow_shield: true
  shield_in_tow: false
  soft_follow: true
  opponent_yield: false
  wake_anticipation_m: 25.0
  tow_accel_gain: 0.3
  path_edge_inset_m: 0.6
  track_limit_margin_m: 0.5
  commit_moves: true
  slow_power_frac: 0.97
  pull_moves: true
  section_win_bonus: 30.0
  section_fail_penalty: 30.0
  section_tail_m: 100.0
  opponent_features: true
  guard:
    react_gap_m: 60.0
    inside_gap_s: 0.35
    inside_from_m: 300.0
    threat_margin_m: 4.0
    cover_lateral_m: 1.0
    reaction_s: 0.15
    max_shift_m: 3.0
    room_m: 3.0

ppo:
  learning_rate: 0.0003
  n_steps: 128
  batch_size: 256
  n_epochs: 8
  gamma: 0.97      # a decision is 0.5 s or a whole move: shorter look-ahead than 0.99
  gae_lambda: 0.95
  ent_coef: 0.02
  clip_range: 0.2

policy:
  net_arch: [256, 256]
  activation_fn: ReLU

sections:
  approach_m: 200.0
  past_apex_m: 30.0
  turn_in_frac: 0.5
  corner_exit_m: 300.0
  straight_from_apex_m: 10.0
  corner_gap_m: 3.0
  corner_shift_m: 3.0
  min_length_m: 80.0
