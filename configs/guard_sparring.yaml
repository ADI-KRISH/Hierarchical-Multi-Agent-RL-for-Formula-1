# Overtaking against the defending sparring driver (``guard_*`` opponents,
# `f1rl.agents.guard`), 2026-10-29. Same world and learning setup as
# tactical_v4.yaml; only the opponents change, plus the guard's settings.
#
# The guard defends each corner on its own by the book: once the car behind is
# close enough to dive (time gap < inside_gap_s and it would be alongside by the
# braking point), it makes ONE move toward the corner's inside before the braking
# zone, never in it and never once the car behind is alongside (front wheels level
# with its rear wheels); it then leaves that car room (room_m), holds its spot on
# the road under braking, and rejoins the line after the apex.
#
# Checked with scripts/guard_gate.py (scripted tactician attacking, pass must stick
# 600 m, 90 s battles). 6 training tracks, 48 battles each, equal pace:
#   car ahead     tactician passes   car that never attacks passes   contacts
#   equal         14/48               2/48                            0
#   guard_equal   10/48               0/48                            0
# At the slow pace (grip 0.80) the guard is about as hard as a plain slow car
# (a car 15% quicker through corners gets by on pace), but it closes the dive-bomb
# door, so the passes it allows are feints, switchbacks and better exits.
# Guard settings below are the defaults (config.GuardParams); lower inside_gap_s or
# higher reaction_s make it an easier partner (a curriculum knob).
tactical: true

run:
  name: guard_sparring
  seed: 0
  total_timesteps: 1500000
  n_envs: 12
  eval_every_steps: 100000
  torch_threads: 2
  bc_decisions: 60000
  bc_epochs: 10
  real_start_frac: 0.5
  incident_dir: data/incidents
  real_eval_per_track: 20
  rival_frac: 0.0
  pool_every_steps: 150000
  pool_size: 8
  normalize_reward: true
  subproc: true

sim:
  dt_s: 0.02
  max_episode_steps: 10000

env:
  action_repeat: 5
  reference_features: true
  tactical: true
  tires: true
  safety_filter: true
  wear_cost_per_unit: 3000.0
  # Attack only: slower and equal cars that defend, plus the plain ones as controls.
  opponents: [guard_slow, guard_slow, guard_mid, guard_equal, slow, equal]
  opponent_gap_m: [10.0, 35.0]
  real_gap_m: [8.0, 40.0]
  overtake_bonus: 100.0
  pass_hold_m: 600.0
  pass_reward_per_m: 1.0
  intervention_penalty: 0.5
  lookahead_windows_m: [10, 20, 30, 40, 50, 60, 80, 100, 125, 150, 200, 250]
  progress_scale_m: 50.0
  fail_penalty: 50.0
  episode_s: 90.0
  min_speed_ms: 3.0
  follow_shield: true
  shield_in_tow: false
  soft_follow: true
  opponent_yield: false
  wake_anticipation_m: 25.0
  tow_accel_gain: 0.3
  path_edge_inset_m: 0.6
  track_limit_margin_m: 0.5
  commit_moves: true
  opponent_features: true
  guard:
    react_gap_m: 60.0
    inside_gap_s: 0.35
    inside_from_m: 300.0
    threat_margin_m: 4.0
    cover_lateral_m: 1.0
    reaction_s: 0.15
    max_shift_m: 3.0
    room_m: 3.0

ppo:
  learning_rate: 0.0003
  n_steps: 128
  batch_size: 256
  n_epochs: 8
  gamma: 0.97
  gae_lambda: 0.95
  ent_coef: 0.02
  clip_range: 0.2

policy:
  net_arch: [256, 256]
  activation_fn: ReLU
