# TACTICAL driver trained from REAL race situations, with no crashes allowed.
# Same driver as tactical.yaml (PPO picks a race-craft move every 0.5 s; a scripted
# path driver executes it), plus:
# - real starts: 40% of training episodes start from a real 2021-2025 pass or
#   defence on the track being driven (train-split races only; f1rl.real_starts).
#   Build the library first: uv run python -m f1rl.incidents --year <Y>
# - safety_filter: both cars run the no-crash filter (models.safety); a model with
#   any contact in an evaluation is never chosen as best.
# The validation evaluation adds the validation tracks' real starts (real_attack /
# real_defend). Held-out tracks: uv run python -m f1rl.scenarios --policy <zip> --real
tactical: true

run:
  name: tactical_real
  seed: 0
  total_timesteps: 1500000   # decisions of 0.5 s, summed over all envs
  n_envs: 8
  eval_every_steps: 100000
  torch_threads: 3
  bc_decisions: 60000
  bc_epochs: 15
  real_start_frac: 0.4
  incident_dir: data/incidents

sim:
  dt_s: 0.02
  max_episode_steps: 10000

env:
  action_repeat: 5
  reference_features: true
  tactical: true
  tires: true
  safety_filter: true
  wear_cost_per_unit: 3000.0
  opponents: [none, backmarker, slow, equal, defender, attacker]
  overtake_bonus: 100.0   # was 20: a pass was worth about the same as staying behind
  lookahead_windows_m: [10, 20, 30, 40, 50, 60, 80, 100, 125, 150, 200, 250]
  progress_scale_m: 10.0
  fail_penalty: 50.0
  episode_s: 60.0

ppo:
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 512
  n_epochs: 6
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.03   # was 0.01: the policy stopped trying moves after behaviour cloning
  clip_range: 0.2

policy:
  net_arch: [256, 256]
  activation_fn: ReLU
