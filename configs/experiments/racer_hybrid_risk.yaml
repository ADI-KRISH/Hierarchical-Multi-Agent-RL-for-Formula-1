# Experiment: racer_hybrid with fail_penalty 50 -> 10 (see PROGRESS.md).
# HYBRID driver: the racer_sac recipe, but the observation also carries the optimal
# racing line (lateral error, heading error, and its limit speed 0-200 m ahead). The
# agent learns to track the line and push past it; it is NOT finding the line unaided
# (racer_sac.yaml is the pure-RL run). 1M decisions.
# Best recipe from the first round of experiments (see PROGRESS.md): finer corner
# lookahead, every reward x10 (progress_scale_m 10, fail_penalty 50, smooth 0.1), and
# a decaying learning rate. 2M decisions.
# Racing-line driver (Phase 4R): one SAC agent steering a Frenet-frame car (RaceEnv)
# across the TUM tracks. Trains on TUM_TRAIN (17 tracks), picks its best checkpoint on
# TUM_VALIDATION (3), and is judged on TUM_HELD_OUT (5), tracks it never trains on.
# Every lap is scored against that track's optimal (minimum-curvature) line, same physics.

run:
  name: racer_hybrid_risk
  seed: 0
  total_timesteps: 600000   # decisions (0.1 s each), summed over all envs
  n_envs: 8
  eval_every_steps: 50000
  eval_seed: 10000
  eval_train_tracks: 4
  torch_threads: 2
  replay_every_decisions: 5  # replay telemetry every 0.5 s

sim:
  dt_s: 0.02
  max_episode_steps: 10000   # lap-mode cap: 200 s

env:                          # RaceEnvParams overrides; unset = config.py defaults
  action_repeat: 5
  reference_features: true   # hybrid: the agent also sees the optimal line
  # Finer corner lookahead (12 windows to 250 m instead of 6): braking points are
  # tens of metres apart, and the coarse windows blur them.
  lookahead_windows_m: [10, 20, 30, 40, 50, 60, 80, 100, 125, 150, 200, 250]
  smooth_penalty: 0.1        # per unit change of the commands, per decision
  progress_scale_m: 10.0
  fail_penalty: 10.0         # was 50: the agent failed only 2-5% of training episodes but
                             # drove ~14% slower than the line -- too risk-averse

sac:
  learning_rate: {start: 0.0003, end: 0.00003}  # linear decay: stops late drift
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 256
  tau: 0.005
  gamma: 0.995               # ~20 s horizon at 10 Hz: braking points are seconds away
  train_freq: 1              # per vec-step, i.e. every n_envs transitions
  gradient_steps: 4          # updates per vec-step (8 transitions): 0.5 updates per sample
  ent_coef: auto

policy:
  net_arch: [256, 256]
  activation_fn: ReLU
