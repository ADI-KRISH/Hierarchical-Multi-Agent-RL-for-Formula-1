# FASTEST CAR THAT CAN OVERTAKE, WIN ONLY (2026-11-01): our car has 1% more
# grip than the field (~0.3 s a lap), starts 10th, and our driver gets the better
# overtaking of strategy_fast_skill.yaml (attack_skill_s 3.4: a pass is a coin flip
# at a 1.5 s/lap edge; the driver thread's target, not a measurement). The reward
# is ONLY the win: +10 for P1, nothing for place or time (user: "train the
# strategy agent to win no matter what, nothing else"); the two-compound rule is
# still enforced (-10). Reward before (strategy_fast_skill): time 0.1/s, place 1,
# finish 1/place, win 20. 1% and the overtaking skill are scenario settings.
#
strategy: true

run:
  name: strategy_fast_win
  seed: 0
  total_timesteps: 1500000    # laps, summed over all envs (~60 laps a race)
  n_envs: 4
  eval_every_steps: 50000
  eval_races: 30
  train_tracks: train
  eval_tracks: validation
  driver_profile: configs/driver_profiles/defend_v2.json
  subproc: true
  select_by: wins
  stay_out_prior: 5.0

env:
  n_cars: 10
  pit_loss_s: 22.0
  rivals: baseline
  rival_stop_jitter: 0.05
  car_pace_spread: 0.0
  our_pace: 1.01
  grid_slot: 10
  attack_skill_s: 3.4
  reward:
    time_weight: 0.0
    position_weight: 0.0
    finish_weight: 0.0
    rule_penalty: 10.0
    win_bonus: 10.0

baseline:
  stints: [medium, hard]
  stop_fractions: [0.45]
  push_index: 2
  max_wear: 0.8

ppo:
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 256
  n_epochs: 10
  gamma: 0.995
  gae_lambda: 0.95
  ent_coef: 0.01
