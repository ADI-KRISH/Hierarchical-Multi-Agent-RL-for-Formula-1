# RESIDUAL driver: the scripted optimal-line follower drives (+2.3% off the limit lap) and
# SAC learns a small correction on top, seeing the follower's command. Starts at the
# follower's pace instead of at a random driver; the checkpoint score can only improve on it.
# Same train/validation/held-out track split as racer_sac.
run:
  name: racer_residual
  seed: 0
  total_timesteps: 1000000   # decisions (0.1 s each), summed over all envs
  n_envs: 8
  eval_every_steps: 50000
  eval_seed: 10000
  eval_train_tracks: 4
  torch_threads: 3
  replay_every_decisions: 5  # replay telemetry every 0.5 s

sim:
  dt_s: 0.02
  max_episode_steps: 10000   # lap-mode cap: 200 s

env:                          # RaceEnvParams overrides; unset = config.py defaults
  action_repeat: 5
  reference_features: true
  residual_scale: 0.2         # policy = correction on top of the scripted LineFollower
  # Finer corner lookahead (12 windows to 250 m instead of 6): braking points are
  # tens of metres apart, and the coarse windows blur them.
  lookahead_windows_m: [10, 20, 30, 40, 50, 60, 80, 100, 125, 150, 200, 250]
  smooth_penalty: 0.1        # per unit change of the commands, per decision
  progress_scale_m: 10.0
  fail_penalty: 50.0

sac:
  learning_rate: {start: 0.0003, end: 0.00003}  # linear decay: stops late drift
  buffer_size: 1000000
  learning_starts: 10000
  batch_size: 256
  tau: 0.005
  gamma: 0.995               # ~20 s horizon at 10 Hz: braking points are seconds away
  train_freq: 1              # per vec-step, i.e. every n_envs transitions
  gradient_steps: 4          # updates per vec-step (8 transitions): 0.5 updates per sample
  ent_coef: auto_0.1      # start with little noise: the base driver is already good

policy:
  net_arch: [256, 256]
  activation_fn: ReLU
