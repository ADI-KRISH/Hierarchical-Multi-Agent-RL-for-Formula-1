<title>Section Overtakes Replay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: pit-wall replay screen. Summary strip on top, battle list left, live replay right; stacks on phones. */
:root {
  --bg: #eef0f2;
  --panel: #ffffff;
  --ink: #15191e;
  --muted: #5d6670;
  --line: #d3d8de;
  --asphalt: #c7ccd2;
  --edge: #7d8792;
  --me: #0a8f8a;
  --opp: #c46a00;
  --good: #1f8a3a;
  --bad: #b8322a;
  --warn: #a8740a;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101317; --panel: #181c21; --ink: #e8ecf0; --muted: #98a2ad; --line: #2b323a;
    --asphalt: #2a3037; --edge: #7a8590; --me: #2cc7bf; --opp: #f0952a;
    --good: #4cc26a; --bad: #ef6a5f; --warn: #e2b23f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101317; --panel: #181c21; --ink: #e8ecf0; --muted: #98a2ad; --line: #2b323a;
  --asphalt: #2a3037; --edge: #7a8590; --me: #2cc7bf; --opp: #f0952a;
  --good: #4cc26a; --bad: #ef6a5f; --warn: #e2b23f; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 16px; }
header { display: grid; gap: 6px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 4vw, 40px); line-height: 1.05; margin: 0; letter-spacing: 0.01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; max-width: 70ch; }
.strip { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; display: grid; gap: 0; min-width: 0; }
.stat b { font-family: var(--display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.main { display: grid; grid-template-columns: minmax(250px, 320px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .main { grid-template-columns: minmax(0, 1fr); } .list { max-height: 300px; } }
.side { display: grid; gap: 10px; min-width: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 13px var(--body); border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip:focus-visible, .row:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--me); outline-offset: 2px; }
select { font: 500 13px var(--body); padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.list { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; max-height: 620px; overflow-y: auto; }
.row { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; color: var(--ink); font: inherit; }
.row:hover { background: color-mix(in srgb, var(--me) 8%, transparent); }
.row[aria-current="true"] { background: color-mix(in srgb, var(--me) 16%, transparent); }
.dot { width: 8px; height: 8px; border-radius: 50%; }
.row .t { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { font-size: 12px; color: var(--muted); }
.why { font-family: var(--mono); font-size: 11px; white-space: nowrap; }
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: grid; min-width: 0; }
.stagehead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.stagehead h2 { font-family: var(--display); font-size: 22px; margin: 0; font-weight: 700; }
.verdict { font-family: var(--mono); font-size: 12px; padding: 3px 8px; border-radius: 4px; align-self: center; border: 1px solid currentColor; }
canvas { display: block; width: 100%; aspect-ratio: 16 / 10; max-width: 100%; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
button.play { font: 600 14px var(--body); background: var(--ink); color: var(--bg); border: 0; border-radius: 6px; padding: 6px 14px; cursor: pointer; min-width: 74px; }
input[type="range"] { flex: 1 1 160px; accent-color: var(--me); min-width: 0; }
.tele { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; padding: 0 12px 12px; font-variant-numeric: tabular-nums; }
.tele div { display: grid; }
.tele span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.tele b { font-family: var(--mono); font-size: 15px; font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 6px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.note { font-size: 13px; color: var(--muted); max-width: 75ch; margin: 0; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="wrap">
  <header>
    <h1 id="title">Corner-by-corner overtaking</h1>
    <p class="sub" id="sub"></p>
  </header>
  <div class="strip" id="strip"></div>
  <div class="main">
    <aside class="side">
      <div class="filters" id="filters" role="group" aria-label="Show"></div>
      <label class="legend" for="track">Track
        <select id="track"></select>
      </label>
      <div class="list" id="list" role="list"></div>
    </aside>
    <section class="stage" aria-label="Replay">
      <div class="stagehead">
        <h2 id="bname">Pick a battle</h2>
        <span class="verdict" id="verdict"></span>
      </div>
      <canvas id="cv" width="1280" height="800" aria-label="Top-down replay of the two cars"></canvas>
      <div class="tele" id="tele"></div>
      <div class="controls">
        <button class="play" id="play" type="button">Play</button>
        <input type="range" id="scrub" min="0" max="100" value="0" aria-label="Time">
        <label class="legend" for="speed">Speed
          <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
        </label>
        <div class="legend"><span><i style="background:var(--me)"></i>Our driver</span><span><i style="background:var(--opp)"></i>Slower car</span><span><i style="background:var(--muted)"></i>Section end</span></div>
      </div>
    </section>
  </div>
  <p class="note" id="note"></p>
</div>

<script>
const DATA = /*DATA*/null;
const $ = (id) => document.getElementById(id);
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const KIND = { straight: "Straight", braking: "Braking zone", corner_in: "Corner, inside", corner_out: "Corner, outside" };
const OPP = { slow: "slow car", guard_slow: "slow defender", rival_ahead_slow: "trained defender", backmarker: "backmarker", rival_tactician: "rule-based attacker", rival_tactician_fast: "fast rule-based attacker", attacker: "aggressive attacker", rival_behind: "our own overtaking driver" };
const WHYCOL = { "clean pass": "--good", "still behind": "--muted", "too close": "--warn", "off track": "--bad", "contact": "--bad", "pass did not stick": "--warn", held: "--good", passed: "--muted" };
let filter = "won", trackSel = "all", cur = null, t = 0, playing = false, last = 0;

function init() {
  if (!DATA) { $("sub").textContent = "No battles embedded."; return; }
  $("title").textContent = DATA.title;
  const B = DATA.battles, won = B.filter(b => b.won).length;
  const tracks = Object.keys(DATA.tracks);
  const DEF = B.length > 0 && B.every(b => b.defend);
  const WIN = DEF ? "held" : "clean passes";
  if (DEF) $("sub").textContent = `Each straight and braking zone of ${tracks.length} track${tracks.length > 1 ? "s" : ""} (${tracks.join(", ")}) as its own defence: start 9 m ahead of a faster attacker on worn tyres, still be ahead at the section's end with no pass stuck. Strict rules: no contact, never off the track, at least 0.5 m of air side by side, no chop across the attacker's nose, one move only.`;
  else $("sub").textContent = `Each straight, braking zone and corner of ${tracks.length} track${tracks.length > 1 ? "s" : ""} (${tracks.join(", ")}) as its own battle: start 9 m behind a slower car, finish ahead by the section's end, and keep the place. Strict rules: no contact, never off the track, at least 0.5 m of air side by side, no cutting across within 3 m of the other car's nose.`;
  const strip = $("strip");
  const stat = (v, l) => { const d = document.createElement("div"); d.className = "stat"; d.innerHTML = `<b>${v}</b><span>${l}</span>`; strip.append(d); };
  stat(`${won}/${B.length}`, WIN);
  for (const k of Object.keys(KIND)) {
    const s = B.filter(b => b.kind === k); if (s.length) stat(`${s.filter(b => b.won).length}/${s.length}`, KIND[k]);
  }
  stat(B.filter(b => b.why === "contact").length, "contacts");
  const f = $("filters");
  for (const [k, l] of [["won", DEF ? "Held" : "Clean passes"], ["all", "All battles"], ["lost", DEF ? "Passed" : "Not won"]]) {
    const c = document.createElement("button"); c.className = "chip"; c.type = "button"; c.textContent = l;
    c.setAttribute("aria-pressed", String(k === filter)); c.dataset.k = k;
    c.onclick = () => { filter = k; for (const x of f.children) x.setAttribute("aria-pressed", String(x.dataset.k === k)); list(); };
    f.append(c);
  }
  const ts = $("track"); ts.innerHTML = `<option value="all">All tracks</option>` + tracks.map(n => `<option>${n}</option>`).join("");
  ts.onchange = () => { trackSel = ts.value; list(); };
  $("note").textContent = `Driver: ${DATA.policy.split(/[\\/]/).slice(-2).join("/")} · config ${DATA.config.split(/[\\/]/).pop()} · replays are recorded every ${Math.round(DATA.dt * 1000)} ms and interpolated.`;
  $("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "Pause" : "Play"; if (playing && cur && t >= cur.frames.length - 1) t = 0; last = performance.now(); };
  $("scrub").oninput = (e) => { if (cur) { t = +e.target.value / 1000 * (cur.frames.length - 1); draw(); } };
  window.addEventListener("resize", draw);
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", draw);
  list();
  requestAnimationFrame(tick);
}

function visible() {
  return DATA.battles.filter(b => (trackSel === "all" || b.track === trackSel) && (filter === "all" || (filter === "won") === b.won));
}

function list() {
  const L = $("list"); L.innerHTML = "";
  const v = visible();
  if (!v.length) { L.innerHTML = `<p class="note" style="padding:12px">No battles match this filter.</p>`; return; }
  for (const b of v) {
    const r = document.createElement("button"); r.type = "button"; r.className = "row"; r.setAttribute("role", "listitem");
    const col = `var(${WHYCOL[b.why] || "--muted"})`;
    r.innerHTML = `<span class="dot" style="background:${col}"></span><span><span class="t">${b.name.replace(/\//g, " · ")}</span><br><span class="m">${KIND[b.kind]} vs ${OPP[b.opponent] || b.opponent}</span></span><span class="why" style="color:${col}">${b.why}</span>`;
    r.onclick = () => select(b, r);
    L.append(r);
  }
  if (!cur || !v.includes(cur)) select(v[0], L.firstChild);
}

function select(b, row) {
  cur = b; t = 0; playing = true; $("play").textContent = "Pause"; last = performance.now();
  for (const x of $("list").children) x.removeAttribute?.("aria-current");
  row?.setAttribute("aria-current", "true");
  $("bname").textContent = `${b.track} T${b.name.split("/T")[1].split("/")[0]} · ${KIND[b.kind]}`;
  const v = $("verdict"); v.textContent = b.why; v.style.color = `var(${WHYCOL[b.why] || "--muted"})`;
  draw();
}

function tick(now) {
  if (playing && cur) {
    // rAF time can lag performance.now() (set on select): never step backwards.
    t = Math.max(0, t + Math.max(0, now - last) / 1000 / DATA.dt * +$("speed").value);
    if (t >= cur.frames.length - 1) { t = cur.frames.length - 1; playing = false; $("play").textContent = "Play"; }
    draw();
  }
  last = now;
  requestAnimationFrame(tick);
}

function lerpFrame(fr, x) {
  x = Math.max(0, Math.min(x || 0, fr.length - 1));
  const i = Math.floor(x), j = Math.min(i + 1, fr.length - 1), u = x - i;
  const a = fr[i], b = fr[j];
  const ang = (p, q) => p + Math.atan2(Math.sin(q - p), Math.cos(q - p)) * u;
  return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, ang(a[2], b[2]), a[3] + (b[3] - a[3]) * u,
          a[4] + (b[4] - a[4]) * u, a[5] + (b[5] - a[5]) * u, ang(a[6], b[6]), a[7] + (b[7] - a[7]) * u,
          a[8] + (b[8] - a[8]) * u, a[9], a[10]];
}

function draw() {
  const cv = $("cv"), ctx = cv.getContext("2d");
  const w = cv.clientWidth, h = cv.clientHeight, dpr = window.devicePixelRatio || 1;
  if (!w) return;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = css("--panel"); ctx.fillRect(0, 0, w, h);
  if (!cur) return;
  const T = DATA.tracks[cur.track], f = lerpFrame(cur.frames, t);
  // Camera: centred between the cars, rotated so we drive up the screen.
  const cx = (f[0] + f[4]) / 2, cy = (f[1] + f[5]) / 2;
  const span = Math.max(70, Math.hypot(f[0] - f[4], f[1] - f[5]) * 2.2);
  const sc = Math.min(w, h) / span;
  ctx.save();
  ctx.translate(w / 2, h * 0.58); ctx.scale(sc, -sc); ctx.rotate(Math.PI / 2 - f[2]); ctx.translate(-cx, -cy);
  roadPath(ctx, T, css("--asphalt"), css("--edge"), 1 / sc);
  // section end line
  ctx.fillStyle = css("--muted"); ctx.beginPath(); ctx.arc(cur.end[0], cur.end[1], 5 / sc, 0, 7); ctx.fill();
  car(ctx, f[4], f[5], f[6], css("--opp"));
  car(ctx, f[0], f[1], f[2], css("--me"));
  ctx.restore();
  // minimap
  mini(ctx, T, f, w, h);
  const mv = DATA.moves[f[10]] || "";
  const gap = -f[8];
  $("tele").innerHTML = [
    ["Time", `${(t * DATA.dt).toFixed(1)} s`],
    ["Our speed", `${Math.round(f[3])} km/h`],
    ["Their speed", `${Math.round(f[7])} km/h`],
    ["Gap", gap >= 0 ? `ahead ${gap.toFixed(1)} m` : `behind ${(-gap).toFixed(1)} m`],
    ["Driver's call", mv.replace("_late", " · late brake").replace(/^(left|right)(\d\.\d)/, "$1 of it, $2 m")],
    ["Too-close steps", `${f[9]}`],
  ].map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("");
  $("scrub").value = String(Math.round(t / Math.max(1, cur.frames.length - 1) * 1000));
  $("scrub").max = "1000";
}

function poly(ctx, a) { ctx.moveTo(a[0], a[1]); for (let i = 2; i < a.length; i += 2) ctx.lineTo(a[i], a[i + 1]); ctx.closePath(); }

function roadPath(ctx, T, fill, edge, px) {
  ctx.beginPath(); poly(ctx, T.l);
  const r = T.r; ctx.moveTo(r[0], r[1]); for (let i = r.length - 2; i >= 0; i -= 2) ctx.lineTo(r[i], r[i + 1]); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill("evenodd");
  ctx.lineWidth = 2 * px; ctx.strokeStyle = edge;
  ctx.beginPath(); poly(ctx, T.l); ctx.stroke();
  ctx.beginPath(); poly(ctx, T.r); ctx.stroke();
  ctx.setLineDash([6 * px, 10 * px]); ctx.lineWidth = 1 * px; ctx.beginPath(); poly(ctx, T.c); ctx.stroke(); ctx.setLineDash([]);
}

function car(ctx, x, y, hd, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(hd);
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(2.75, 0); ctx.lineTo(1.6, 0.95); ctx.lineTo(-2.75, 0.95); ctx.lineTo(-2.75, -0.95); ctx.lineTo(1.6, -0.95); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function mini(ctx, T, f, w, h) {
  const c = T.c; let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (let i = 0; i < c.length; i += 2) { x0 = Math.min(x0, c[i]); x1 = Math.max(x1, c[i]); y0 = Math.min(y0, c[i + 1]); y1 = Math.max(y1, c[i + 1]); }
  const box = Math.min(150, w * 0.28), pad = 10, s = box / Math.max(x1 - x0, y1 - y0);
  ctx.save(); ctx.translate(w - box - pad, pad);
  ctx.fillStyle = css("--bg"); ctx.globalAlpha = 0.85; ctx.fillRect(-6, -6, box + 12, box + 12); ctx.globalAlpha = 1;
  const X = (x) => (x - x0) * s, Y = (y) => box - (y - y0) * s;
  ctx.beginPath(); ctx.moveTo(X(c[0]), Y(c[1])); for (let i = 2; i < c.length; i += 2) ctx.lineTo(X(c[i]), Y(c[i + 1])); ctx.closePath();
  ctx.strokeStyle = css("--edge"); ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = css("--me"); ctx.beginPath(); ctx.arc(X(f[0]), Y(f[1]), 4, 0, 7); ctx.fill();
  ctx.restore();
}

init();
</script>
