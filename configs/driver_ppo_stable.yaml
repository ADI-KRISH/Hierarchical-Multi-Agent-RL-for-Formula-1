# Best technical-track driver so far (43.90 s; baseline mean 43.19 s). Same as
# driver_ppo.yaml plus what the slow-driver diagnosis found helps (PROGRESS.md):
# a 3x stronger time penalty, the braking-point countdown observation, and PPO
# stabilisers (larger rollouts, linear learning-rate decay, a KL limit).

run:
  name: driver_ppo_stable
  seed: 0
  track: technical          # oval | technical | <year>:<grand prix>
  total_timesteps: 2000000  # decisions (each is action_repeat physics steps)
  n_envs: 8
  eval_every_steps: 50000
  eval_episodes: 5
  eval_seed: 10000          # held-out reset seeds, disjoint from training envs
  torch_threads: 1

sim:                        # SimParams overrides (seed comes from run.seed)
  dt_s: 0.02
  max_episode_steps: 4000   # 80 s: ~2x the baseline lap; faster feedback than 200 s

env:                        # DriverEnvParams overrides; unset = config.py defaults
  action_repeat: 5          # decide every 0.1 s (5 physics steps)
  time_penalty_per_s: 0.03   # was 0.01: speed paid too little
  brake_point_horizon_m: 300.0  # "marker boards" countdown observation

ppo:
  learning_rate: {start: 0.0003, end: 0.0}  # linear decay
  target_kl: 0.02
  n_steps: 2048             # decisions per env -> 16384 samples per update
  batch_size: 512
  n_epochs: 10
  gamma: 0.995              # ~20 s horizon at 10 Hz: 0.98 (5 s) learned to park
                            # before the chicane -- too short to value the rest of the lap
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0

policy:
  net_arch: [128, 128]
  activation_fn: Tanh
